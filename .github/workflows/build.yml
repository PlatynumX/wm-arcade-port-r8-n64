name: build

on:
  push:
    branches-ignore: [rom-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch historical source for source-aware tests
        run: sh ./scripts/fetch_original.sh
      - name: Configure portable verifier
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Build portable verifier
        run: cmake --build build-host --parallel
      - name: Run portable tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Run source-attract smoke test
        run: ./build-host/wm_headless

  source-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch historical source and regenerate translated source data
        run: sh ./scripts/regenerate_source_data.sh
      - name: Inventory complete historical source tree
        run: |
          sh ./scripts/inventory_original.sh
          sh ./scripts/build_source_ir.sh
          sh ./scripts/build_animation_ir.sh
      - name: Verify checked-in translated tables are reproducible
        run: git diff --exit-code -- src/generated/attract_sequence.c src/generated/select_tables.c src/generated/port_status.c src/generated/finish_sequences.c src/generated/bret_visuals.c src/generated/bret_attacks.c docs/PORT_COVERAGE.md
      - name: Convert original WIMP and BLIMP artwork to portable C
        run: |
          sh ./scripts/prepare_bret_sprites.sh
          sh ./scripts/prepare_frontend_assets.sh
      - name: Compile generated sprite sources on host
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/bret_sprites.c -o /tmp/bret_sprites.o
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/sports_logo.c -o /tmp/sports_logo.o
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/dcs_logo.c -o /tmp/dcs_logo.o
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/title_screen.c -o /tmp/title_screen.o
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/title_sparkle.c -o /tmp/title_sparkle.o
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/bmod_tables.c -o /tmp/bmod_tables.o
      - name: Show generated artwork footprint
        run: |
          wc -c src/generated/bret_sprites.c src/generated/sports_logo.c src/generated/dcs_logo.c src/generated/title_screen.c src/generated/title_sparkle.c
          grep -c '^    {"H' src/generated/bret_sprites.c
          test "$(grep -c '^    {"SPRTLG' src/generated/sports_logo.c)" -eq 17
          test -s src/generated/dcs_logo.c
          test -s src/generated/title_screen.c
          test -s src/generated/title_sparkle.c
          test "$(grep -c '"SPARKLE.IMG"' src/generated/title_sparkle.c)" -eq 69
          test -s src/generated/bmod_tables.c
          grep -q '"NTITLESCBMOD", {403, 256, 40' src/generated/bmod_tables.c
          grep -q '"SPORTBKBMOD", {1100, 400, 71' src/generated/bmod_tables.c

  n64-rom:
    runs-on: ubuntu-latest
    env:
      N64_INST: /opt/libdragon
      LIBDRAGON_REV: 0c665e8439aba143424631ba29ef2c305eaa986b
    steps:
      - uses: actions/checkout@v4

      - name: Install official N64 GCC toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN_URL="https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb"
          TOOLCHAIN_SHA256="fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d"
          TOOLCHAIN_DEB="$RUNNER_TEMP/gcc-toolchain-mips64-amd64.deb"

          curl -fL --retry 5 --retry-all-errors \
            -o "$TOOLCHAIN_DEB" "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_SHA256  $TOOLCHAIN_DEB" | sha256sum -c -

          sudo dpkg -i "$TOOLCHAIN_DEB"
          test -x "$N64_INST/bin/mips64-elf-gcc"
          "$N64_INST/bin/mips64-elf-gcc" --version | head -1
          sudo chown -R "$USER":"$(id -gn)" "$N64_INST"


      - name: Ensure host-side asset tools exist
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl gcc g++ git make python3 xxd
          python3 --version
          git --version
          make --version | head -1

      - name: Install pinned libdragon SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$N64_INST/bin/mips64-elf-gcc"
          export PATH="$N64_INST/bin:$PATH"
          rm -rf /tmp/libdragon
          git init -q /tmp/libdragon
          git -C /tmp/libdragon remote add origin https://github.com/DragonMinded/libdragon.git
          git -C /tmp/libdragon fetch -q --depth 1 origin "$LIBDRAGON_REV"
          git -C /tmp/libdragon checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/libdragon rev-parse HEAD)" = "$LIBDRAGON_REV"
          make -C /tmp/libdragon -j2 install
          make -C /tmp/libdragon -j2 tools-install
          test -f "$N64_INST/include/n64.mk"
          test -f "$N64_INST/mips64-elf/lib/libdragon.a"
          test -x "$N64_INST/bin/n64tool"

      - name: Regenerate source data and original artwork
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/regenerate_source_data.sh
          sh ./scripts/inventory_original.sh
          sh ./scripts/build_source_ir.sh
          sh ./scripts/build_animation_ir.sh
          sh ./scripts/prepare_bret_sprites.sh
          sh ./scripts/prepare_frontend_assets.sh
          sh ./scripts/prepare_streamed_character_assets.sh
          sh ./scripts/prepare_ring_assets.sh
          test -s src/generated/bret_sprites.c
          test -s filesystem/wrestlers/STREAMED_ROSTER.txt
          test -s filesystem/ring/STREAMED_RING.txt
          test "$(find filesystem/ring -type f -name 'h*.bin' | wc -l)" -eq 95
          test "$(grep -c '^blocks=211$' filesystem/ring/STREAMED_RING.txt)" -eq 1
          STREAMED_FRAMES=$(find filesystem/wrestlers -type f -name '*.bin' | wc -l)
          STREAMED_BYTES=$(du -cb filesystem/wrestlers/*/*.bin | tail -1 | awk '{print $1}')
          echo "streamed wrestler frames=$STREAMED_FRAMES bytes=$STREAMED_BYTES"
          test "$STREAMED_FRAMES" -ge 5000
          test "$STREAMED_BYTES" -gt 25000000
          test -s src/generated/sports_logo.c
          test -s src/generated/dcs_logo.c
          test -s src/generated/title_screen.c
          test -s src/generated/title_sparkle.c
          test "$(grep -c '"SPARKLE.IMG"' src/generated/title_sparkle.c)" -eq 69
          test -s src/generated/bmod_tables.c
          test -s build/source_ir.json
          test -s build/SOURCE_FRONTIER.md
          test -s build/animation_ir.json
          test -s build/ANIMATION_FRONTIER.md
          test "$(grep -c '^    {"SPRTLG' src/generated/sports_logo.c)" -eq 17

      - name: Export Bret PNG inspection assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/export_bret_pngs.py \
            --lod original/wwf-wrestlemania/IMG/BRET.LOD \
            --img-dir original/wwf-wrestlemania/IMG \
            --visual-source src/generated/bret_visuals.c \
            --visual-source src/generated/bret_attacks.c \
            --out-zip bret-r8-textures-png.zip
          test -s bret-r8-textures-png.zip
          python3 - <<'PYZIP'
          import zipfile
          z=zipfile.ZipFile('bret-r8-textures-png.zip')
          pngs=[n for n in z.namelist() if n.lower().endswith('.png')]
          print(f'PNG frames in zip: {len(pngs)}')
          assert len(pngs) >= 100
          PYZIP

      - name: Build Nintendo 64 ROM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/n64 wm_arcade_r9.z64
          make -j2
          test -s wm_arcade_r9.z64
          ROM_BYTES=$(wc -c < wm_arcade_r9.z64)
          echo "ROM bytes=$ROM_BYTES"
          test "$ROM_BYTES" -gt 25000000
          ls -lh wm_arcade_r9.z64

      - name: Build native-toolchain baseline control ROM
        shell: bash
        run: |
          set -euo pipefail

          # Preserve the WirePass1 ROM first.
          cp wm_arcade_r9.z64 wm_arcade_r9_wirepass_native.z64

          BASELINE_SHA="c62500241e96d0d865bf968503614b9ea3d38aeb"
          BASEDIR="$RUNNER_TEMP/wm-baseline-native"

          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          rm -rf "$BASEDIR"
          git worktree add --detach "$BASEDIR" "$BASELINE_SHA"

          # Reuse the exact historical arcade source already fetched for the
          # WirePass1 build, then run the baseline's own source/asset pipeline.
          mkdir -p "$BASEDIR/original"
          cp -a original/wwf-wrestlemania "$BASEDIR/original/"

          cd "$BASEDIR"
          sh ./scripts/regenerate_source_data.sh
          sh ./scripts/inventory_original.sh
          sh ./scripts/build_source_ir.sh
          sh ./scripts/build_animation_ir.sh
          sh ./scripts/prepare_bret_sprites.sh
          sh ./scripts/prepare_frontend_assets.sh
          sh ./scripts/prepare_streamed_character_assets.sh

          rm -rf build/n64 wm_arcade_r9.z64
          make -j2
          test -s wm_arcade_r9.z64
          BASE_BYTES=$(wc -c < wm_arcade_r9.z64)
          echo "baseline native ROM bytes=$BASE_BYTES"
          test "$BASE_BYTES" -gt 25000000

          cp wm_arcade_r9.z64 "$GITHUB_WORKSPACE/wm_arcade_r9_baseline_native.z64"
          cd "$GITHUB_WORKSPACE"

          test -s wm_arcade_r9_wirepass_native.z64
          test -s wm_arcade_r9_baseline_native.z64

      - name: Upload ROM and coverage as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: wm-arcade-r9-build
          if-no-files-found: error
          retention-days: 14
          path: |
            wm_arcade_r9.z64
            wm_arcade_r9_wirepass_native.z64
            wm_arcade_r9_baseline_native.z64
            docs/PORT_COVERAGE.md
            build/SOURCE_FRONTIER.md
            build/source_ir.json
            build/ANIMATION_FRONTIER.md
            build/animation_ir.json
            build/SOURCE_INVENTORY.md
            bret-r8-textures-png.zip

      - name: Publish diagnostic ROM pair to rom-build branch
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -s wm_arcade_r9.z64
          test -s wm_arcade_r9_wirepass_native.z64
          test -s wm_arcade_r9_baseline_native.z64

          cp wm_arcade_r9.z64 /tmp/wm_arcade_r9.z64
          cp wm_arcade_r9_wirepass_native.z64 /tmp/wm_arcade_r9_wirepass_native.z64
          cp wm_arcade_r9_baseline_native.z64 /tmp/wm_arcade_r9_baseline_native.z64

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan rom-build-tmp
          git rm -rf . >/dev/null 2>&1 || true

          cp /tmp/wm_arcade_r9.z64 ./wm_arcade_r9.z64
          cp /tmp/wm_arcade_r9_wirepass_native.z64 ./wm_arcade_r9_wirepass_native.z64
          cp /tmp/wm_arcade_r9_baseline_native.z64 ./wm_arcade_r9_baseline_native.z64

          {
            echo "WrestleMania Arcade N64 native-toolchain A/B"
            echo "source_commit=$GITHUB_SHA"
            echo "wirepass_source=8a3f338d1cc1114fb9c625daa5121b3c92190b7e"
            echo "baseline_source=c62500241e96d0d865bf968503614b9ea3d38aeb"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD.txt

          git add -f \
            wm_arcade_r9.z64 \
            wm_arcade_r9_wirepass_native.z64 \
            wm_arcade_r9_baseline_native.z64 \
            BUILD.txt
          git commit -m "A-B ROM build ${GITHUB_SHA::12}"
          git push --force origin HEAD:rom-build
